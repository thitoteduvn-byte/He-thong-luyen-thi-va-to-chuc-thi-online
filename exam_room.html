<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý phòng thi & ca thi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  .tab-on { border-color:#4f46e5; color:#4338ca; font-weight:600 }
  .bar:hover { opacity:.85 }
  #tip { position:fixed; pointer-events:none; z-index:60 }
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

<header class="bg-white shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
    <h1 class="text-lg font-bold text-indigo-700">🏫 Phòng thi & Ca thi</h1>
    <div class="ml-auto flex items-center gap-2 text-sm" id="userBox"></div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-5">
  <!-- Đăng nhập -->
  <section id="viewLogin" class="hidden max-w-sm mx-auto bg-white rounded-xl shadow p-6 mt-10">
    <h2 class="font-bold text-lg mb-1">Đăng nhập giáo viên</h2>
    <p class="text-sm text-slate-500 mb-4">Dùng tài khoản Supabase giống trang quản trị.</p>
    <input id="lgEmail" type="email" placeholder="Email" class="w-full border rounded p-2 mb-2">
    <input id="lgPass" type="password" placeholder="Mật khẩu" class="w-full border rounded p-2 mb-3" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()" class="w-full bg-indigo-600 text-white rounded py-2 font-medium hover:bg-indigo-700">Đăng nhập</button>
    <p id="lgErr" class="text-sm text-red-600 mt-2"></p>
  </section>

  <!-- Danh sách phòng -->
  <section id="viewRooms" class="hidden">
    <div class="flex items-center mb-4">
      <h2 class="text-xl font-bold">Phòng thi của tôi</h2>
      <button onclick="newRoom()" class="ml-auto bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-indigo-700">+ Tạo phòng thi</button>
    </div>
    <div id="roomList" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>

  <!-- Chi tiết phòng -->
  <section id="viewRoom" class="hidden">
    <button onclick="showRooms()" class="text-sm text-indigo-600 hover:underline mb-2">← Tất cả phòng thi</button>
    <div class="flex flex-wrap items-center gap-2 mb-3">
      <h2 id="roomTitle" class="text-xl font-bold"></h2>
      <span id="roomMeta" class="text-sm text-slate-500"></span>
    </div>
    <div class="flex gap-4 border-b mb-4 text-sm">
      <button id="tabCfg" onclick="setTab('cfg')" class="pb-2 border-b-2 border-transparent">⚙️ Cấu hình đề</button>
      <button id="tabShifts" onclick="setTab('shifts')" class="pb-2 border-b-2 border-transparent">🕒 Ca thi</button>
      <button id="tabRes" onclick="setTab('res')" class="pb-2 border-b-2 border-transparent">📊 Kết quả</button>
    </div>
    <div id="paneCfg"></div>
    <div id="paneShifts" class="hidden"></div>
    <div id="paneRes" class="hidden"></div>
  </section>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 items-start justify-center overflow-y-auto p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-3xl my-8 p-5" id="modalBody"></div>
</div>
<div id="tip" class="hidden bg-slate-800 text-white text-xs rounded px-2 py-1 shadow"></div>
<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm rounded-lg px-4 py-2 shadow-lg z-[70]"></div>

<script>
const SUPABASE_URL = 'https://xzznmfgihzjeqsmiuypi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_dUldhQYF1ETrSCZ4jiy3Og_ygfkm9XW';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TYPES = [
  ['multiple_choice', 'Trắc nghiệm'], ['true_false', 'Đúng/Sai'],
  ['short_answer', 'Trả lời ngắn'], ['essay', 'Tự luận']
];
const TYPE_NAME = Object.fromEntries(TYPES);
const LEVELS = [['nhan_biet', 'Nhận biết'], ['thong_hieu', 'Thông hiểu'], ['van_dung', 'Vận dụng'], ['van_dung_cao', 'Vận dụng cao']];
const STATE_UI = {
  active:   ['Đang thi', 'bg-green-100 text-green-700'],
  upcoming: ['Chưa tới giờ', 'bg-amber-100 text-amber-700'],
  ended:    ['Đã kết thúc', 'bg-slate-200 text-slate-600'],
  closed:   ['Đã đóng', 'bg-red-100 text-red-700']
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = d => d ? new Date(d).toLocaleString('vi-VN', { hour12: false, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const mmss = s => s == null ? '' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const pad = n => String(n).padStart(2, '0');
const toLocalInput = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`; };
const noAccent = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2800); }
function dbErr(e) {
  const m = e?.message || String(e);
  if (/LIMIT_REACHED/.test(m)) return m.replace(/^.*LIMIT_REACHED:\s*/, '');
  if (/does not exist|schema cache/i.test(m)) return m + ' — hãy chạy file exam_room_setup.sql trong Supabase → SQL Editor.';
  if (/row-level security|permission denied/i.test(m)) return m + ' — chưa có quyền; kiểm tra bạn đã đăng nhập và đã chạy exam_room_setup.sql.';
  return m;
}
function math(el) { try { renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false }); } catch (e) {} }

let user = null, rooms = [], room = null, shifts = [], tab = 'cfg';
let usage = null;
async function loadUsage() { try { const { data } = await db.rpc('my_feature_usage'); usage = data || null; } catch (e) { usage = null; } }
let results = [], resShift = 'all', resSearch = '', resSort = 'name', autoTimer = null;
let cfgExam = null;   // đề đã lưu đang chọn cho phòng: { id, title, ids[], counts{}, missing }

/* ======================= ĐĂNG NHẬP ======================= */
async function login() {
  $('lgErr').textContent = '';
  const { error } = await db.auth.signInWithPassword({ email: $('lgEmail').value.trim(), password: $('lgPass').value });
  if (error) $('lgErr').textContent = 'Đăng nhập thất bại: ' + error.message;
}
async function logout() { await db.auth.signOut(); }
function setUser(u) {
  if ((u?.id || null) === (user?.id || null) && $('userBox').innerHTML) return;   // bỏ qua TOKEN_REFRESHED
  user = u;
  $('userBox').innerHTML = u ? `<span class="text-slate-500">${esc(u.email)}</span><button onclick="logout()" class="border rounded px-2 py-1 hover:bg-slate-50">Đăng xuất</button>` : '';
  if (!u) { hide('viewRooms'); hide('viewRoom'); show('viewLogin'); return; }
  hide('viewLogin'); loadRooms();
}
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');

/* ======================= DANH SÁCH PHÒNG ======================= */
async function loadRooms() {
  const { data, error } = await db.from('exam_rooms').select('*').order('created_at', { ascending: false });
  if (error) { toast(dbErr(error)); $('roomList').innerHTML = `<p class="text-red-600 text-sm col-span-full">${esc(dbErr(error))}</p>`; show('viewRooms'); return; }
  rooms = data || [];
  showRooms();
}
function totalQ(r) { return Array.isArray(r.matrix?.fixed_ids) && r.matrix.fixed_ids.length ? r.matrix.fixed_ids.length : Object.values(r.matrix?.counts || {}).reduce((a, b) => a + (+b || 0), 0); }
function showRooms() {
  stopAuto(); room = null;
  hide('viewRoom'); show('viewRooms');
  $('roomList').innerHTML = rooms.length ? rooms.map(r => `
    <div class="bg-white rounded-xl shadow p-4 hover:shadow-md cursor-pointer" onclick="openRoom(${r.id})">
      <div class="flex items-start gap-2">
        <h3 class="font-semibold flex-1">${esc(r.title)}</h3>
        <code class="text-xs bg-indigo-50 text-indigo-700 rounded px-1.5 py-0.5">${esc(r.room_code)}</code>
      </div>
      <p class="text-sm text-slate-500 mt-1">Lớp ${r.grade} · ${esc(r.subject)} · ${r.duration_minutes} phút · ${totalQ(r)} câu</p>
      <p class="text-xs text-slate-400 mt-2">${r.matrix.exam_title ? '📄 ' + esc(r.matrix.exam_title) + ' · ' : ''}${TYPES.map(([k, n]) => (r.matrix.counts?.[k] || 0) ? `${n} ${r.matrix.counts[k]}` : '').filter(Boolean).join(' · ')}</p>
    </div>`).join('') : '<p class="text-slate-500 col-span-full">Chưa có phòng thi nào. Bấm “Tạo phòng thi” để bắt đầu.</p>';
}
async function newRoom() { room = null; shifts = []; enterRoomView(); setTab('cfg'); }
async function openRoom(id) {
  room = rooms.find(r => r.id === id);
  enterRoomView();
  await loadShifts();
  setTab('shifts');
}
function enterRoomView() {
  hide('viewRooms'); show('viewRoom');
  $('roomTitle').textContent = room ? room.title : 'Tạo phòng thi mới';
  $('roomMeta').textContent = room ? `Mã phòng: ${room.room_code} · Lớp ${room.grade} · ${room.subject}` : '';
  $('tabShifts').disabled = $('tabRes').disabled = !room;
  $('tabShifts').classList.toggle('opacity-40', !room); $('tabRes').classList.toggle('opacity-40', !room);
}
function setTab(t) {
  tab = t; stopAuto();
  if (!room && t !== 'cfg') t = tab = 'cfg';
  for (const [k, id] of [['cfg', 'Cfg'], ['shifts', 'Shifts'], ['res', 'Res']]) {
    $('tab' + id).classList.toggle('tab-on', k === t);
    $('pane' + id).classList.toggle('hidden', k !== t);
  }
  if (t === 'cfg') renderCfg();
  if (t === 'shifts') renderShifts();
  if (t === 'res') loadResults();
}

/* ======================= CẤU HÌNH PHÒNG ======================= */
function renderCfg() {
  const r = room, m = r?.matrix || {};
  const grades = Array.from({ length: 12 }, (_, i) => i + 1);
  cfgExam = Array.isArray(m.fixed_ids) && m.fixed_ids.length ? { id: m.exam_id, title: m.exam_title || 'Đề đã lưu', ids: m.fixed_ids, counts: m.counts || {}, missing: 0 } : null;
  $('paneCfg').innerHTML = `
  <div class="bg-white rounded-xl shadow p-5 grid gap-4 md:grid-cols-2">
    <div class="md:col-span-2">
      <div class="text-sm font-medium mb-1">Đề thi</div>
      <div class="flex flex-wrap items-center gap-3 border rounded-lg p-3">
        <button type="button" onclick="pickExam()" class="bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-indigo-700">📂 Tải đề thi đã lưu</button>
        <div id="examSum" class="text-sm flex-1 min-w-[12rem]"></div>
      </div>
    </div>
    <label class="text-sm font-medium md:col-span-2">Tên phòng thi
      <input id="fTitle" class="w-full border rounded p-2 mt-1 font-normal" value="${esc(r?.title || '')}" placeholder="Kiểm tra giữa kì I - Toán 10"></label>
    <label class="text-sm font-medium">Lớp
      <select id="fGrade" class="w-full border rounded p-2 mt-1 font-normal">${grades.map(g => `<option value="${g}" ${(r?.grade || 10) == g ? 'selected' : ''}>Lớp ${g}</option>`).join('')}</select></label>
    <label class="text-sm font-medium">Môn
      <input id="fSubject" list="subjects" class="w-full border rounded p-2 mt-1 font-normal" value="${esc(r?.subject || 'Toán')}">
      <datalist id="subjects"><option>Toán<option>Tiếng Việt<option>Tiếng Anh<option>Vật lý<option>Hóa học<option>Sinh học<option>Lịch sử<option>Địa lý</datalist></label>
    <label class="text-sm font-medium">Mã phòng (dùng trong link)
      <div class="flex gap-2 mt-1"><input id="fCode" class="flex-1 border rounded p-2 font-normal uppercase" value="${esc(r?.room_code || '')}" placeholder="TOAN10-GK1">
      <button type="button" onclick="suggestCode()" class="border rounded px-3 text-sm hover:bg-slate-50">Gợi ý</button></div>
      <span class="text-xs font-normal text-slate-400">3–32 ký tự: chữ không dấu, số, - hoặc _</span></label>
    <label class="text-sm font-medium">Thời gian làm bài (phút)
      <input id="fDur" type="number" min="1" max="600" class="w-full border rounded p-2 mt-1 font-normal" value="${r?.duration_minutes || 45}"></label>
    <label class="md:col-span-2 flex items-start gap-2 text-sm">
      <input id="fShuffle" type="checkbox" class="mt-1" ${m.shuffle ? 'checked' : ''}>
      <span><b>Trộn thứ tự câu hỏi</b> cho từng học sinh<br><span class="text-slate-500">Tắt: mọi học sinh làm theo đúng thứ tự của đề đã lưu.</span></span></label>
    <label class="md:col-span-2 flex items-start gap-2 text-sm">
      <input id="fShufOpt" type="checkbox" class="mt-1" ${m.shuffle_options ? 'checked' : ''}>
      <span><b>Đổi thứ tự phương án A–D</b> cho từng học sinh (câu trắc nghiệm)<br><span class="text-slate-500">Mỗi em thấy các phương án theo thứ tự khác nhau, khó chép bài của bạn bên cạnh. Chấm điểm vẫn đúng. Lưu ý: nếu đề có phương án hoặc lời giải kiểu “cả A và B”, “đáp án ở câu trên”... thì nên tắt.</span></span></label>
    <label class="md:col-span-2 flex items-start gap-2 text-sm">
      <input id="fFull" type="checkbox" class="mt-1" ${m.fullscreen ? 'checked' : ''}>
      <span><b>Bắt buộc làm bài toàn màn hình</b><br><span class="text-slate-500">Học sinh phải bấm vào toàn màn hình mới làm được; thoát giữa chừng bị ghi 1 lần vi phạm (cùng cơ chế chuyển tab). Trình duyệt không hỗ trợ (ví dụ iPhone) sẽ tự bỏ qua yêu cầu này.</span></span></label>
    <label class="md:col-span-2 flex items-start gap-2 text-sm">
      <input id="fReview" type="checkbox" class="mt-1" ${r?.show_review ? 'checked' : ''}>
      <span><b>Cho học sinh xem đáp án và lời giải sau khi nộp bài.</b><br><span class="text-slate-500">Nếu tắt, học sinh chỉ thấy điểm. Đáp án luôn nằm trên máy chủ, không gửi xuống trước khi nộp.</span></span></label>
    <div class="md:col-span-2 flex flex-wrap items-center gap-2 pt-2 border-t">
      <button onclick="saveRoom()" class="bg-indigo-600 text-white rounded-lg px-5 py-2 text-sm font-medium hover:bg-indigo-700">${r ? 'Lưu thay đổi' : 'Tạo phòng thi'}</button>
      ${r ? `<button onclick="askDeleteRoom()" class="ml-auto border border-red-300 text-red-600 rounded-lg px-4 py-2 text-sm hover:bg-red-50">Xóa phòng thi</button>` : ''}
    </div>
  </div>`;
  showExamSum();
}
function showExamSum() {
  const el = $('examSum'); if (!el) return;
  if (!cfgExam) {
    const old = room && Object.values(room.matrix?.counts || {}).some(v => +v);
    el.innerHTML = old ? `<span class="text-slate-600">Phòng này đang rút ngẫu nhiên theo ma trận (${TYPES.map(([k, n]) => room.matrix.counts[k] ? `${n} ${room.matrix.counts[k]}` : '').filter(Boolean).join(' · ')}). Chọn một đề đã lưu để thay thế.</span>`
      : '<span class="text-slate-400">Chưa chọn đề. Bấm “Tải đề thi đã lưu” để chọn đề của bạn.</span>'; return;
  }
  const c = cfgExam;
  el.innerHTML = `<div class="font-semibold">${esc(c.title)}</div>
    <div class="text-slate-600">${c.ids.length} câu · ${TYPES.map(([k, n]) => c.counts[k] ? `${n} ${c.counts[k]}` : '').filter(Boolean).join(' · ')}</div>
    ${c.missing ? `<div class="text-red-600 text-xs mt-1">⚠ ${c.missing} câu trong đề không còn trong ngân hàng nên đã bị bỏ qua.</div>` : ''}`;
}
async function pickExam() {
  openModal('<p class="text-slate-500">Đang tải danh sách đề đã lưu…</p>');
  const sel = c => db.from('exams').select(c).order('created_at', { ascending: false }).limit(200);
  let { data, error } = await sel('id, title, grade, subject, minutes, question_count, created_at, is_public, owner_id');
  if (error && /is_public|owner_id/.test(error.message || '')) ({ data, error } = await sel('id, title, grade, subject, minutes, question_count, created_at'));   // chưa chạy exam_privacy_setup.sql
  if (error) return $('modalBody').innerHTML = `<p class="text-red-600">${esc(dbErr(error))}</p><button onclick="closeModal()" class="border rounded px-4 py-2 text-sm mt-3">Đóng</button>`;
  window._exams = data || [];
  $('modalBody').innerHTML = `<div class="flex items-center mb-3"><h3 class="font-bold text-lg">Chọn đề thi đã lưu</h3><button onclick="closeModal()" class="ml-auto border rounded px-4 py-2 text-sm">Đóng</button></div>
    <input id="exQ" placeholder="Tìm theo tên đề, môn, lớp" oninput="renderExamList()" class="w-full border rounded p-2 mb-3 text-sm"><div id="exList" class="grid gap-2 max-h-[60vh] overflow-y-auto"></div>`;
  renderExamList();
}
const privBadge = e => e.is_public === false ? '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800 whitespace-nowrap">🔒 Riêng tư (Private)</span>' : '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-sky-100 text-sky-800 whitespace-nowrap">🌐 Công khai (Public)</span>';
function renderExamList() {
  const q = ($('exQ').value || '').toLowerCase();
  const list = window._exams.filter(e => `${e.title} ${e.subject} lớp ${e.grade}`.toLowerCase().includes(q));
  $('exList').innerHTML = list.map(e => `<button onclick="useExam(${e.id})" class="text-left border rounded-lg p-3 hover:bg-indigo-50">
      <div class="font-semibold flex flex-wrap items-center gap-2"><span>${esc(e.title)}</span>${privBadge(e)}</div>
      <div class="text-xs text-slate-500">${e.owner_id && user && e.owner_id !== user.id ? 'Chia sẻ từ giáo viên khác · ' : ''}Lớp ${esc(e.grade)} · ${esc(e.subject)} · ${esc(e.question_count ?? '?')} câu${e.minutes ? ' · ' + esc(e.minutes) + ' phút' : ''} · ${fmt(e.created_at)}</div></button>`).join('')
    || '<p class="text-slate-400 text-sm p-3">Không có đề nào. Hãy lưu đề ở trang tạo đề trước.</p>';
}
async function useExam(id) {
  $('exList').innerHTML = '<p class="text-slate-500 p-3">Đang tải đề…</p>';
  const { data, error } = await db.from('exams').select('id, title, grade, subject, minutes, data').eq('id', id).single();
  if (error) return toast(dbErr(error));
  const want = [...new Set((data.data?.questions || []).map(q => Number(q.id)).filter(Number.isFinite))];
  if (!want.length) { closeModal(); return toast('Đề này không có mã câu hỏi (ID) nên không dùng được cho phòng thi.'); }
  const have = new Map();
  for (let i = 0; i < want.length; i += 150) {
    const { data: rows, error: e2 } = await db.from('questions').select('id, question_type').in('id', want.slice(i, i + 150));
    if (e2) return toast(dbErr(e2));
    rows.forEach(r => have.set(r.id, r.question_type));
  }
  const ids = want.filter(x => have.has(x)), counts = {};
  ids.forEach(x => counts[have.get(x)] = (counts[have.get(x)] || 0) + 1);
  if (!ids.length) { closeModal(); return toast('Không tìm thấy câu hỏi của đề này trong ngân hàng.'); }
  cfgExam = { id: data.id, title: data.title, ids, counts, missing: want.length - ids.length };
  if (!$('fTitle').value.trim()) $('fTitle').value = data.title;
  if (data.grade) $('fGrade').value = data.grade;
  if (data.subject) $('fSubject').value = data.subject;
  if (data.minutes) $('fDur').value = data.minutes;
  closeModal(); showExamSum(); toast(`Đã tải đề “${data.title}” (${ids.length} câu).`);
}
function suggestCode() {
  const s = noAccent($('fSubject').value).replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 6) || 'PHONG';
  $('fCode').value = `${s}${$('fGrade').value}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
}
async function saveRoom() {
  const title = $('fTitle').value.trim(), subject = $('fSubject').value.trim(), code = $('fCode').value.trim().toUpperCase();
  const dur = Math.round(+$('fDur').value);
  const err = [];
  if (!title) err.push('thiếu tên phòng'); if (!subject) err.push('thiếu môn');
  if (!/^[A-Za-z0-9_-]{3,32}$/.test(code)) err.push('mã phòng phải 3–32 ký tự (chữ không dấu, số, - hoặc _)');
  if (!(dur >= 1 && dur <= 600)) err.push('thời gian làm bài 1–600 phút');
  if (!cfgExam && !room) err.push('chưa chọn đề thi (bấm “Tải đề thi đã lưu”)');
  if (err.length) return toast('Chưa hợp lệ: ' + err.join('; '));
  const matrix = cfgExam
    ? { exam_id: cfgExam.id, exam_title: cfgExam.title, fixed_ids: cfgExam.ids, shuffle: $('fShuffle').checked, counts: cfgExam.counts, chapters: [], difficulties: [] }
    : { ...room.matrix };
  matrix.shuffle_options = $('fShufOpt').checked; matrix.fullscreen = $('fFull').checked;
  const payload = { title, subject, room_code: code, grade: +$('fGrade').value, duration_minutes: dur, show_review: $('fReview').checked, matrix };
  const q = room ? db.from('exam_rooms').update(payload).eq('id', room.id).select().single() : db.from('exam_rooms').insert(payload).select().single();
  const { data, error } = await q;
  if (error) return toast(error.code === '23505' ? 'Mã phòng đã tồn tại, hãy chọn mã khác.' : dbErr(error));
  const isNew = !room;
  room = data; const i = rooms.findIndex(r => r.id === data.id); if (i >= 0) rooms[i] = data; else rooms.unshift(data);
  toast(isNew ? 'Đã tạo phòng thi. Hãy thêm ca thi.' : 'Đã lưu.');
  enterRoomView();
  if (isNew) { shifts = []; setTab('shifts'); } else renderCfg();
}

async function loadShifts() {
  const [s, c] = await Promise.all([
    db.from('exam_shifts').select('*').eq('room_id', room.id).order('start_time'),
    db.from('exam_results').select('shift_id,submitted_at').eq('room_id', room.id)
  ]);
  if (s.error) toast(dbErr(s.error));
  shifts = s.data || [];
  const cnt = {}; (c.data || []).forEach(r => { const o = cnt[r.shift_id] ||= { all: 0, done: 0 }; o.all++; if (r.submitted_at) o.done++; });
  shifts.forEach(x => x._c = cnt[x.id] || { all: 0, done: 0 });
  await loadUsage();
}

async function saveShift(id) {
  const name = $('sName').value.trim(), code = $('sCode').value.trim().toUpperCase();
  const st = new Date($('sStart').value), en = new Date($('sEnd').value);
  const err = [];
  if (!name) err.push('thiếu tên ca');
  if (!/^[A-Za-z0-9_-]{1,32}$/.test(code)) err.push('mã ca chỉ gồm chữ không dấu, số, - hoặc _');
  if (isNaN(st) || isNaN(en)) err.push('thiếu giờ bắt đầu/kết thúc'); else if (en <= st) err.push('giờ kết thúc phải sau giờ bắt đầu');

/* --- Biểu đồ phổ điểm: 1 màu, cột mảnh bo góc 4px ở đầu, khe 2px, lưới mờ --- */
function bins(sc) { const b = Array(10).fill(0); sc.forEach(v => b[Math.min(9, Math.max(0, Math.floor(v)))]++); return b; }
function renderHist(sc) {
  const b = bins(sc), mx = Math.max(1, ...b), top = Math.max(2, Math.ceil(mx / 2) * 2);
  const W = 640, H = 200, L = 34, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B, bw = pw / 10;
  const y = v => T + ph - v / top * ph;
  let g = '';
  for (let i = 0; i <= 2; i++) { const v = top * i / 2; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#64748b">${Number.isInteger(v) ? v : v.toFixed(1)}</text>`; }
  b.forEach((v, i) => {
    const x = L + i * bw + 3, w = bw - 6, h = v / top * ph, r = Math.min(4, h);
    const tip = `${i}–${i === 9 ? 10 : i + 1} điểm: ${v} học sinh`;
    if (v > 0) g += `<path class="bar" fill="#4f46e5" d="M${x},${T + ph} V${y(v) + r} Q${x},${y(v)} ${x + r},${y(v)} H${x + w - r} Q${x + w},${y(v)} ${x + w},${y(v) + r} V${T + ph} Z"/>`;
    g += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ph}" fill="transparent" data-tip="${tip}" onmousemove="showTip(event)" onmouseleave="hideTip()"/>`;
    g += `<text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#64748b">${i}–${i === 9 ? 10 : i + 1}</text>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="#94a3b8"/>`;
  $('hist').innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Phổ điểm">${g}</svg>`;
  $('histTable').innerHTML = `<table class="text-sm w-full max-w-sm"><thead class="text-left text-slate-500"><tr><th class="py-1">Khoảng điểm</th><th class="text-right">Số học sinh</th></tr></thead><tbody>${b.map((v, i) => `<tr class="border-t"><td class="py-1">${i}–${i === 9 ? 10 : i + 1}</td><td class="text-right">${v}</td></tr>`).join('')}</tbody></table>`;
}
function toggleHistTable() { const t = $('histTable').classList.toggle('hidden'); $('hist').classList.toggle('hidden', !t); $('histBtn').textContent = t ? 'Xem dạng bảng' : 'Xem dạng biểu đồ'; }
function showTip(e) { const t = $('tip'); t.textContent = e.target.dataset.tip; t.classList.remove('hidden'); t.style.left = (e.clientX + 12) + 'px'; t.style.top = (e.clientY - 28) + 'px'; }
function hideTip() { $('tip').classList.add('hidden'); }

/* --- Xóa / chấm lại --- */
async function delResult(id) {
  const r = results.find(x => x.id === id);
  if (!confirm(`Xóa bài của ${r.student_name} (${r.student_code})? Học sinh này sẽ được làm lại từ đầu trong ca thi.`)) return;
  const { error } = await db.from('exam_results').delete().eq('id', id);
  if (error) return toast(dbErr(error));
  toast('Đã xóa'); loadResults();
}
async function regrade() {
  const ids = resShift === 'all' ? shifts.map(s => s.id) : [+resShift];
  if (!ids.length) return;
  if (!confirm('Chấm lại các bài đã nộp theo đáp án hiện tại trong ngân hàng câu hỏi?')) return;
  let n = 0;
  for (const id of ids) { const { data, error } = await db.rpc('exam_regrade', { p_shift: id }); if (error) return toast(dbErr(error)); n += data || 0; }
  toast(`Đã chấm lại ${n} bài`); loadResults();
}

/* --- Xem bài làm của học sinh --- */
const ansText = (t, a) => a == null || a === '' ? '' : t === 'true_false' && typeof a === 'object' ? ['a', 'b', 'c', 'd'].map(k => `${k}) ${a[k] || '–'}`).join('  ') : String(a);
function isRight(q, a) {
  if (a == null || a === '' || q.correct_answer == null) return null;
  if (q.question_type === 'multiple_choice') return String(a).toUpperCase() === String(q.correct_answer).toUpperCase();
  if (q.question_type === 'true_false') { const c = String(q.correct_answer).split(','); return ['a', 'b', 'c', 'd'].every((k, i) => (a[k] || '') === c[i].trim()); }
  if (q.question_type === 'short_answer') { const n = s => String(s).trim().toLowerCase().replace(/\s+/g, '').replace(',', '.'); return String(q.correct_answer).split('|').some(x => n(x) === n(a) || (!isNaN(n(x)) && !isNaN(n(a)) && +n(x) === +n(a))); }
  return null;
}
async function viewSub(id) {
  const r = results.find(x => x.id === id);
  openModal('<p class="text-slate-500">Đang tải bài làm…</p>');
  const { data, error } = await db.from('questions').select('id,question_type,content,image_url,options,correct_answer').in('id', r.question_ids);
  if (error) return $('modalBody').innerHTML = `<p class="text-red-600">${esc(dbErr(error))}</p><button onclick="closeModal()" class="border rounded px-4 py-2 text-sm mt-3">Đóng</button>`;
  const map = Object.fromEntries((data || []).map(q => [q.id, q]));
  const items = r.question_ids.map((qid, i) => {
    const q = map[qid]; if (!q) return `<div class="border rounded p-3 text-sm text-slate-400">Câu ${i + 1}: câu hỏi #${qid} đã bị xóa khỏi ngân hàng.</div>`;
    const a = r.answers?.[qid], ok = isRight(q, a);
    return `<div class="border rounded-lg p-3 ${ok === true ? 'border-green-300 bg-green-50' : ok === false ? 'border-red-300 bg-red-50' : ''}">
      <div class="text-xs text-slate-500 mb-1">Câu ${i + 1} · ${TYPE_NAME[q.question_type]}</div>
      <div class="text-sm">${esc(q.content)}</div>${q.image_url ? `<img src="${esc(q.image_url)}" class="max-h-40 mt-2 rounded">` : ''}
      <div class="text-sm mt-2">Học sinh chọn: <b>${esc(ansText(q.question_type, a)) || '<i class="text-slate-400">bỏ trống</i>'}</b>${q.correct_answer != null && q.question_type !== 'essay' ? ` · Đáp án: <b>${esc(q.correct_answer)}</b>` : ''}</div></div>`;
  }).join('');
  $('modalBody').innerHTML = `<div class="flex items-center mb-3"><div><h3 class="font-bold text-lg">${esc(r.student_name)} <span class="text-slate-400 font-normal">(${esc(r.student_code)})</span></h3>
    <p class="text-sm text-slate-500">Điểm: <b>${r.score == null ? 'chưa chấm' : (+r.score).toFixed(2)}</b> · ${mmss(r.time_spent_seconds)} · ${fmt(r.submitted_at)}</p>
    <p class="text-sm ${r.violations > 2 ? 'text-red-600' : 'text-slate-500'}">Vi phạm: <b>${r.violations || 0}</b>${r.violations ? ` (${esc(vioText(r))})` : ''}${vioPen(r) ? ` · đã trừ ${vioPen(r).toFixed(1)} điểm` : ''}</p></div>
    <button onclick="closeModal()" class="ml-auto border rounded px-4 py-2 text-sm">Đóng</button></div><div class="grid gap-2">${items}</div>`;
  math($('modalBody'));
}

/* --- Xuất file --- */
function exportRows() {
  return filteredResults().map((r, i) => ({
    'STT': i + 1, 'Mã HS': r.student_code, 'Họ tên': r.student_name, 'Lớp': r.student_class || '', 'Ca thi': shiftName(r.shift_id),
    'Điểm': r.score == null ? '' : +r.score, 'Số câu đúng': r.right_count, 'Số câu chấm tự động': r.auto_total, 'Số câu đã làm': r.answered,
    'Thời gian làm (phút:giây)': mmss(r.time_spent_seconds), 'Số lần vi phạm': r.violations || 0, 'Điểm bị trừ do vi phạm': vioPen(r), 'Chi tiết vi phạm': (r.violations ? vioText(r) : ''), 'Giờ nộp': fmt(r.submitted_at), 'Trạng thái': resStatus(r)
  }));
}
function fileBase() { return `ketqua_${room.room_code}${resShift === 'all' ? '' : '_' + (shifts.find(s => s.id == resShift)?.shift_code || resShift)}`; }
function exportCSV() {
  const rows = exportRows(); if (!rows.length) return toast('Chưa có dữ liệu để xuất.');
  const cols = Object.keys(rows[0]), q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '﻿' + [cols.map(q).join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = fileBase() + '.csv'; a.click();
}
function exportXLSX() {
  const rows = exportRows(); if (!rows.length) return toast('Chưa có dữ liệu để xuất.');
  const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = [6, 12, 24, 10, 14, 8, 10, 12, 10, 14, 10, 14, 30, 18, 12].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Kết quả');
  XLSX.writeFile(wb, fileBase() + '.xlsx');
}

/* ======================= MODAL & KHỞI ĐỘNG ======================= */
function openModal(html) { $('modalBody').innerHTML = html; const m = $('modal'); m.classList.remove('hidden'); m.classList.add('flex'); }
function closeModal() { const m = $('modal'); m.classList.add('hidden'); m.classList.remove('flex'); }
$('modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });

db.auth.onAuthStateChange((_e, session) => setUser(session?.user || null));
db.auth.getSession().then(({ data }) => { if (!user) setUser(data.session?.user || null); });
/* ===== Khu vực GIÁO VIÊN: chặn tài khoản HỌC SINH =====
   Giao diện chỉ là lớp chắn cho dễ hiểu; quyền thật vẫn do chính sách RLS (student_setup.sql) quyết định ở máy chủ. */
(function guardStudent() {
  const STUDENT_HOME = 'student_home.html';
  let lastId = null, ov = null;
  function overlay(on, email) {
    if (!on) { if (ov) { ov.remove(); ov = null; document.body.style.overflow = ''; } return; }
    if (ov) return;
    ov = document.createElement('div');
    ov.setAttribute('role', 'alertdialog');
    ov.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:rgba(30,27,75,.92);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif';
    ov.innerHTML = '<div style="background:#fff;max-width:420px;width:100%;border-radius:20px;padding:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)">'
      + '<div style="font-size:44px">🔒</div>'
      + '<h2 style="margin:8px 0 6px;font-size:20px;font-weight:800;color:#1e1b4b">Khu vực dành cho giáo viên</h2>'
      + '<p style="margin:0 0 4px;color:#475569;font-size:14px;line-height:1.5">Tài khoản <b></b> là tài khoản học sinh nên không được soạn đề hay quản lý phòng thi.</p>'
      + '<p style="margin:0 0 18px;color:#64748b;font-size:13px">Nếu bạn là giáo viên, hãy đăng xuất rồi đăng nhập bằng tài khoản giáo viên.</p>'
      + '<a href="' + STUDENT_HOME + '" style="display:block;background:#4f46e5;color:#fff;font-weight:700;padding:12px;border-radius:12px;text-decoration:none;margin-bottom:8px">Về trang học sinh</a>'
      + '<button type="button" style="width:100%;background:#fff;color:#4f46e5;border:2px solid #c7d2fe;font-weight:700;padding:10px;border-radius:12px;cursor:pointer">Đăng xuất</button></div>';
    ov.querySelector('b').textContent = email || '';
    ov.querySelector('button').onclick = () => db.auth.signOut();
    document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  }
  async function check(session) {
    const u = session?.user || null;
    if ((u?.id || null) === lastId) return;
    lastId = u?.id || null;
    if (!u) return overlay(false);
    const { data, error } = await db.rpc('is_student');          // chưa chạy student_setup.sql → lỗi → coi như không phải học sinh
    if (lastId !== u.id) return;
    overlay(!error && data === true, u.email);
  }
  db.auth.getSession().then(({ data }) => check(data.session));
  db.auth.onAuthStateChange((_e, s) => setTimeout(() => check(s), 0));   // setTimeout: tránh gọi Supabase ngay trong callback
})();
</script>
